[package]
name = "rkg-inspector"
version = "0.1.0"
edition = "2024"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
chrono = "0.4"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
iced = { version = "0.14.0", features = ["image", "svg", "advanced", "tokio"] }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
rfd = "0.17.2"
rkg-utils = "2.0.0"
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
webbrowser = "1.2.1"
